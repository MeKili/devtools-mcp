[project]
name = "devtools-mcp"
version = "0.1.0"
description = "A custom Model Context Protocol (MCP) server exposing developer tools"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
devtools-mcp = "devtools_mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devtools_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["devtools_mcp"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

# FastMCP's @mcp.tool() comes from an Any-typed import, so mypy would flag the
# decorated wrappers in server.py. The pure logic in tools.py stays fully strict.
[[tool.mypy.overrides]]
module = ["devtools_mcp.server"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
